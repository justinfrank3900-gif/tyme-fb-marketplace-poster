<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:340px; background:#0d0d12; color:#e2e8f0; font-family:system-ui,sans-serif; font-size:13px; }
  .header { background:#13131a; padding:14px 16px; border-bottom:1px solid #1e1e2c; display:flex; align-items:center; gap:10px; }
  .header-icon { width:34px; height:34px; border-radius:7px; }
  .header-text .title { font-weight:800; font-size:14px; background:linear-gradient(135deg,#ffe27a,#f5c518 45%,#b8860b); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; letter-spacing:.3px; }
  .header-text .sub { font-size:10px; color:#64748b; }
  .body { padding:16px; }
  .status { background:#1e1e2c; border-radius:8px; padding:12px; margin-bottom:12px; font-size:12px; color:#94a3b8; line-height:1.5; }
  .status.loading { color:#60a5fa; }
  .status.success { color:#4ade80; background:#052e16; }
  .status.error { color:#f87171; background:#2d0a0a; }
  .vehicle-info { background:#1e1e2c; border-radius:8px; padding:12px; margin-bottom:12px; }
  .label { font-size:10px; color:#64748b; margin-bottom:2px; text-transform:uppercase; letter-spacing:.5px; }
  .value { font-size:13px; font-weight:600; color:#e2e8f0; margin-bottom:8px; }
  .photos-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; margin-top:8px; }
  .photos-grid img { width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:4px; }
  .btn { width:100%; padding:11px; border:none; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer; margin-bottom:8px; font-family:inherit; }
  .btn-primary { background:#1877f2; color:white; }
  .btn-secondary { background:#2d3748; color:#e2e8f0; }
  .btn:disabled { opacity:0.5; cursor:not-allowed; }
  .divider { border:none; border-top:1px solid #1e1e2c; margin:12px 0; }
  .url-input { width:100%; background:#1e1e2c; border:1px solid #2d3748; border-radius:6px; padding:8px 10px; color:#e2e8f0; font-size:12px; margin-bottom:8px; font-family:inherit; outline:none; }
  .url-input:focus { border-color:#f5c518; }
  .url-input::placeholder { color:#64748b; }
  .photo-count { font-size:10px; color:#64748b; margin-top:4px; }
</style>
</head>
<body>
<div class="header">
  <img src="icons/icon128.png" class="header-icon" alt="TYME">
  <div class="header-text">
    <div class="title">TYME Facebook Marketplace Poster</div>
    <div class="sub">Facebook Marketplace Poster</div>
  </div>
</div>
<div class="body">
  <div id="status" class="status">Paste a vehicle listing URL below or navigate to a listing page.</div>
  <input type="text" id="urlInput" class="url-input" placeholder="Paste AutoTrader, Kaizen, CarGurus link..."/>
  <button class="btn btn-secondary" id="scrapeBtn">🔍 Pull Listing Data</button>
  <div id="vehicleInfo" style="display:none">
    <div class="vehicle-info">
      <div class="label">Vehicle</div>
      <div class="value" id="infoTitle">—</div>
      <div class="label">Price</div>
      <div class="value" id="infoPrice">—</div>
      <div class="label">KMs / Colour</div>
      <div class="value" id="infoKms">—</div>
      <div class="label">Photos</div>
      <div class="photos-grid" id="photosGrid"></div>
      <div class="photo-count" id="photoCount"></div>
    </div>
    <button class="btn btn-primary" id="postBtn">📘 Post to Facebook Marketplace</button>
  </div>
  <hr class="divider">
  <div style="font-size:10px;color:#475569;text-align:center">TYME · Easy Auto Loans Canada · The Wolf of Subprime</div>
</div>
<script src="popup.js"></script>
</body>
</html>
